name: FileRadar installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Build installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            package: "*.exe"
          - platform: Linux
            os: ubuntu-24.04
            package: "*.deb"
          - platform: macOS
            os: macos-latest
            package: "*.dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwxgtk3.2-dev dpkg-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install wxwidgets
          echo "$(brew --prefix wxwidgets)/bin" >> "$GITHUB_PATH"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          vcpkg install wxwidgets:x64-windows-static

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFILERADAR_BUILD_GUI=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFILERADAR_BUILD_GUI=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create native installer
        run: cpack --config build/CPackConfig.cmake -C Release -B packages

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FileRadar-${{ matrix.platform }}-installer
          path: packages/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14
